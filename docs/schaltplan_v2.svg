<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <defs>
    <style>
      text { font-family:Arial,Helvetica,sans-serif; fill:#24323f; }
      .title { font-size:30px; font-weight:700; }
      .heading { font-size:22px; font-weight:700; }
      .text { font-size:18px; }
      .small { font-size:16px; }
      .panel { fill:#ffffff; stroke:#c5ced8; stroke-width:2; rx:16; }
      .box { fill:#eef4fb; stroke:#425466; stroke-width:2; rx:12; }
      .planned { fill:#fff5d6; stroke:#9c6a0d; stroke-width:2; stroke-dasharray:8 5; rx:12; }
      .power { fill:none; stroke:#b91c1c; stroke-width:4; marker-end:url(#arrow); }
      .gnd { stroke:#374151; stroke-width:3; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1400" height="1040" fill="#f7f4eb"/>
  <text x="40" y="52" class="title">RC-Seilwinde V2.0 – Anschlussübersicht</text>
  <text x="40" y="87" class="text">Versorgung korrigiert: 2026-10-07. Wandler gefordert; Auswahl und Einbau noch offen.</text>

  <rect x="40" y="120" width="1320" height="300" class="panel"/>
  <text x="65" y="158" class="heading">Motorleistung: separater 2S-LiPo, kein Strom aus der RC-Anlage</text>
  <rect x="70" y="185" width="240" height="140" class="box"/>
  <text x="90" y="222" class="heading">2S-LiPo</text>
  <text x="90" y="258" class="text">7,4 V nominal</text>
  <text x="90" y="291" class="text">8,4 V voll</text>
  <rect x="395" y="185" width="240" height="140" class="box"/>
  <text x="415" y="222" class="heading">ACS712</text>
  <text x="415" y="258" class="text">Primär-Strompfad</text>
  <text x="415" y="291" class="small">Modulvariante prüfen</text>
  <rect x="720" y="185" width="240" height="140" class="box"/>
  <text x="740" y="222" class="heading">Brushless-ESC</text>
  <text x="740" y="258" class="text">Turnigy Plush 30A</text>
  <text x="740" y="291" class="text">BEC unbenutzt</text>
  <rect x="1045" y="185" width="240" height="140" class="box"/>
  <text x="1065" y="222" class="heading">Windenmotor</text>
  <text x="1065" y="258" class="text">Vom ESC versorgt</text>
  <text x="1065" y="291" class="small">Brushless-Antrieb</text>
  <path d="M 310 250 L 385 250" class="power"/>
  <path d="M 635 250 L 710 250" class="power"/>
  <path d="M 960 250 L 1035 250" class="power"/>
  <text x="65" y="363" class="text">ESC-Servokabel: Signal + GND anschließen; BEC-Plus isolieren.</text>
  <text x="65" y="396" class="small">High-Side-Leistungsschalter / Precharge als spätere Ergänzung geplant, hier noch nicht eingezeichnet.</text>

  <rect x="40" y="445" width="1320" height="270" class="panel"/>
  <text x="65" y="483" class="heading">Steuerung: Versorgung aus der RC-Anlage bleibt bei ausgeschaltetem ESC an</text>
  <rect x="70" y="510" width="280" height="125" class="box"/>
  <text x="90" y="547" class="heading">RC-Anlage / CB320</text>
  <text x="90" y="581" class="text">Swiss: derzeit 6,0 V</text>
  <text x="90" y="613" class="small">Spätere HV-Spannung offen</text>
  <rect x="460" y="510" width="285" height="125" class="planned"/>
  <text x="480" y="547" class="heading">Passender 5-V-Wandler</text>
  <text x="480" y="581" class="text">Erforderlich; Typ offen</text>
  <text x="480" y="613" class="small">Eingang für 6 V / HV prüfen</text>
  <rect x="875" y="510" width="410" height="125" class="box"/>
  <text x="895" y="547" class="heading">Arduino + Sensorik</text>
  <text x="895" y="581" class="text">Nano, Hall KY-003, ACS712-VCC</text>
  <text x="895" y="613" class="small">Stabile 5 V; kein Motor-/Servo-/Lichtstrom</text>
  <path d="M 350 568 L 450 568" class="power"/>
  <path d="M 745 568 L 865 568" class="power"/>
  <text x="774" y="548" class="text">5,0 V</text>
  <text x="65" y="678" class="text">Gemeinsame Masse: RC, Wandler, Arduino, Sensoren und ESC; saubere Rückstromführung.</text>

  <rect x="40" y="740" width="1320" height="235" class="panel"/>
  <text x="65" y="780" class="heading">V2.0-Signalbelegung – V3.0 / Nano R4 separat qualifizieren</text>
  <text x="65" y="821" class="text">D2: Hall OUT (2 Pulse/Umdrehung)</text>
  <text x="735" y="821" class="text">D7: Endschalter gegen GND, active-low</text>
  <text x="65" y="860" class="text">D3: RC Speed, D5: RC Trigger</text>
  <text x="735" y="860" class="text">A3: ACS712 OUT</text>
  <text x="65" y="899" class="text">D4: ESC-Servosignal</text>
  <text x="735" y="899" class="text">D13: Status-LED</text>
  <text x="65" y="941" class="small">5-V-Entkopplung, USB-Rückspeisung, Signalpegel, EMV und Einschaltreihenfolge am Aufbau prüfen.</text>
  <text x="40" y="1014" class="small">Funktionale Übersicht, kein E-CAD-Schaltplan. Verbindliche Details: docs/hardware.md und docs/software_v3_0.md.</text>
</svg>
